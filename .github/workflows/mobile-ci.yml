name: Mobile CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile
      - name: Analyze
        run: flutter analyze
        working-directory: mobile
      - name: Run Tests
        run: flutter test
        working-directory: mobile
