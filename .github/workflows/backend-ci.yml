name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Run Lint
        run: npm run lint
        working-directory: backend
      - name: Run Tests
        run: npm run test
        working-directory: backend
      - name: Run Build
        run: npm run build
        working-directory: backend
