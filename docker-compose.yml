version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tripcraft-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tripcraft
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripcraft-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/tripcraft?schema=public
    depends_on:
      - postgres

volumes:
  pgdata:
